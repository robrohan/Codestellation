name: windows-build

"on":
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # windows-latest ships MSVC + CMake already; the default CMake
      # generator here is the Visual Studio one, which is multi-config
      # (Debug/Release chosen at build time, not configure time) and
      # nests output under a <Config> subdirectory per target -- hence
      # the dynamic exe lookup in the smoke-test steps below rather than
      # a hardcoded path.
      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      # codemap-view needs a real GPU/display to open a window, which
      # this runner doesn't have, so it's only verified to build+link
      # here. codemap-build is headless and gets exercised for real
      # against each language's fixtures plus a mixed-language walk,
      # mirroring the checks done locally on macOS during development.
      #
      # PowerShell does NOT automatically fail a step just because an
      # external .exe it invoked via `&` returned a non-zero exit code --
      # it only sets $LASTEXITCODE and keeps going. Checking that
      # explicitly after every invocation avoids a smoke test that can
      # never actually go red.
      - name: Smoke-test codemap-build against all fixtures
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -Path build -Recurse -Filter codemap-build.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw "codemap-build.exe not found in build output" }
          Write-Host "Using: $exe"

          function Run-Fixture($root, $out) {
            & $exe --root $root --out $out
            if ($LASTEXITCODE -ne 0) { throw "codemap-build failed (exit $LASTEXITCODE) for root '$root'" }
            if (-not (Test-Path $out)) { throw "$out was not created for root '$root'" }
            Get-Content $out
          }

          Run-Fixture "test\fixtures\c" "graph-c.json"
          Run-Fixture "test\fixtures\csharp" "graph-csharp.json"
          Run-Fixture "test\fixtures\lisp" "graph-lisp.json"
          Run-Fixture "test\fixtures" "graph-mixed.json"

      - name: Confirm codemap-view.exe was built
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build -Recurse -Filter codemap-view.exe | Select-Object -First 1
          if (-not $exe) { throw "codemap-view.exe not found in build output" }
          Write-Host "Found: $($exe.FullName)"
